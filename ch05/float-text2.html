<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>float 속성 예제</title>
    <style>
        img { float: left; margin: 0 12px 8px 0; }
        /* 이미지를 왼쪽에 띄우면 텍스트가 오른쪽을 감싼다 */
    </style>
</head>
<body>
   <img src="images/photo.jpg" alt="이미지">
   <p>float:left를 준 이미지:
     오른쪽으로 텍스트가 흘러 들어가 이미지를 감싼다.</p>
</body>
</html>
