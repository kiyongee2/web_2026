<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>색상 표기법</title>
  <style>
    .a{color: red;}
    .b{color: #ff0000;}
    .c{color: rgb(255, 0, 0);}
    .d{color: rgba(255, 0, 0, 0.5);}
  </style>
</head>
<body>
  <p class="a">red</p> 
  <p class="b">#ff0000</p> 
  <p class="c">rgb(255, 0, 0)</p> 
  <p class="d">rgba(255, 0, 0, 0.5)</p>
</body>
</html>
