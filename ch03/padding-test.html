<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .box {
        width: 300px;
        border: 1px solid #7048e8;
        padding: 20px;   /* 내용과 테두리 사이 20px */
    }
    .btn {
        margin-top: 10px;
        padding: 10px 20px;   /* 위아래 10 / 좌우 20 */
    }
  </style>
</head>
<body>
  <div class="box">내용과 테두리 사이 여백</div>
  <button class="btn">확인</button>
</body>
</html>
